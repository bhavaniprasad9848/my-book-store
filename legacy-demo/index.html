<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MY BOOK STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="bg-pattern" aria-hidden="true"></div>

    <header class="topbar" id="topbar" hidden>
      <div class="brand-lockup">
        <span class="brand-mark">MB</span>
        <div>
          <p class="brand-name">MY BOOK STORE</p>
          <p class="brand-tag" id="welcome-text"></p>
        </div>
      </div>
      <nav class="top-actions">
        <button class="ghost-btn" id="nav-shop" type="button">Shop</button>
        <button class="cart-btn" id="nav-cart" type="button">
          Cart <span class="cart-count" id="cart-count">0</span>
        </button>
        <button class="ghost-btn" id="nav-logout" type="button">Logout</button>
      </nav>
    </header>

    <main id="app"></main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
